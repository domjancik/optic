<!doctype html><html><body><canvas style="width:640px;height:480px"></canvas><pre id="result">Checking…</pre><script type="module">
import {ProjectionScene} from '../scene.js';
const c=document.querySelector('canvas'),s=new ProjectionScene(c);
s.set({glare:false,ambient:0,yaw:.8,pitch:.3});
const image=color=>{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,32,32);return c;};
s.setSlices([{z:200,image:image('red')},{z:800,image:image('blue')}],600,true,.3);
const textures=s.sliceRenderer.planes.map(p=>p.texture),g=s.gl,read=()=>{const d=new Uint8Array(c.width*c.height*4);g.readPixels(0,0,c.width,c.height,g.RGBA,g.UNSIGNED_BYTE,d);return d;};
const before=read();s.set({sliceInfill:true,infillSteps:8});const after=read();let changed=0,mixed=0;for(let i=0;i<after.length;i+=4){if(before[i]!==after[i]||before[i+2]!==after[i+2])changed++;if(after[i]>5&&after[i+2]>5)mixed++;}
const reused=s.sliceRenderer.planes.every((p,i)=>p.texture===textures[i]);s.set({sliceInfill:false});const restored=read().every((v,i)=>v===before[i]);const error=g.getError();document.querySelector('#result').textContent=JSON.stringify({passed:changed>100&&mixed>100&&reused&&restored&&error===0,changed,mixed,reused,restored,error});
</script></body></html>
