<!doctype html><html><body style="background:#111;color:white"><div style="position:relative;width:640px;height:480px"><canvas id="c" style="width:100%;height:100%"></canvas></div><pre id="result">Checking…</pre><script type="module">
import {ProjectionScene} from '../scene.js';
const scene=new ProjectionScene(document.getElementById('c'));
scene.set({sceneMode:'bench',objects:true,distanceM:1,fieldM:.6,exposure:.08});scene.fitView();
const image=document.createElement('canvas');image.width=image.height=32;const ctx=image.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,32,32);
scene.setSlices([{z:900,image}],600,true,.7);
const gl=scene.gl,read=()=>{const a=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,a);return a;};
scene.set({sliceShadows:false});const off=read();scene.set({sliceShadows:true});const on=read();let darker=0,brighter=0;for(let i=0;i<off.length;i+=4){const d=off[i]+off[i+1]+off[i+2]-on[i]-on[i+1]-on[i+2];if(d>3)darker++;if(d< -3)brighter++;}
const error=gl.getError();document.getElementById('result').textContent=JSON.stringify({pass:darker>50&&brighter===0&&error===0,darkerPixels:darker,brighterPixels:brighter,glError:error});
</script></body></html>
